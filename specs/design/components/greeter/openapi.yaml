openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: Returns a JSON greeting for an optional name.
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Get a JSON greeting, optionally personalized by name
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Name to personalize the greeting with; defaults to "World" when omitted or empty.
      responses:
        '200':
          description: The greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The generated greeting text, e.g. "Hello, World!"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP or application error code
        message:
          type: string
          description: short human-readable label
        description:
          type: string
          description: detailed explanation
        moreInfo:
          type: string
          description: URI to documentation
